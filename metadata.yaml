name: astrbot_plugin_redalert
display_name: QQ 红包提醒
short_desc: 白名单群出现可领取红包时私聊提醒主人并在群里感谢；NapCat 需先打 wallet 补丁
desc: |
  监听指定 QQ 群的红包消息，一旦发现可领取红包，先私聊提醒主人，再在原群发一句感谢；不会自动领取。

  适合“群里发红包，但机器人不方便/不应该抢”的场景：主人第一时间收到提醒，手动去抢；机器人在群里感谢发送者，不碰领取逻辑，不调用 LLM，零 token 成本。

  NapCat 用户需先运行仓库 `tools/patch_napcat_wallet.py`，把 `walletElement` 转为 JSON；否则真实红包无法识别。

特性：
  - 支持 OneBot v11 / aiocqhttp / NapCat
  - 白名单群监听，其他群完全忽略
  - 优先 NapCat 私聊，失败自动回退 AstrBot 会话
  - 同一红包 10 秒内只提醒一次
  - 支持自定义提醒模板
  - 提供 `/红包测试`、`/红包状态` 管理命令
version: 1.2.1
author: dafeiyu
repo: https://github.com/MyronYoung/astrbot_plugin_redalert
astrbot_version: ">=4.5.0"
support_platforms:
  - aiocqhttp
tags:
  - 红包
  - 提醒
  - 通知
  - QQ
  - aiocqhttp
